<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nail Art AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR Face -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-face
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <a-assets>
        <a-asset-item
          id="nailModel"
          src="model/modelcreampita.glb"
        ></a-asset-item>
      </a-assets>

      <!-- Kamera -->
      <a-camera position="0 0 0"></a-camera>

      <!-- Nail Art (sementara di depan wajah dulu, BIAR KELIHATAN) -->
      <a-entity
        gltf-model="#nailModel"
        position="0 0 -0.5"
        scale="0.02 0.02 0.02"
      ></a-entity>
    </a-scene>
  </body>
</html>
