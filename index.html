<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AR Nail Art - Hand Tracking</title>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<style>
body { margin:0; overflow:hidden; background:black; }
#startBtn {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 24px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  background: #ff69b4;
  color: white;
  z-index: 10;
}
video { display:none; }
</style>
</head>

<body>

<button id="startBtn">Start AR Nail Art</button>
<video id="video" autoplay playsinline></video>

<script>
/* =====================
   THREE.JS
===================== */
const scene = new THREE.Scene();
const camera3D = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera3D.position.z = 2;

const renderer = new THREE.WebGLRenderer({ alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1));

let nail;
const loader = new THREE.GLTFLoader();
loader.load("model/modelcreampita.glb", gltf => {
  nail = gltf.scene;
  nail.scale.set(0.15,0.15,0.15);
  scene.add(nail);
});

/* =====================
   MEDIAPIPE HANDS
===================== */
const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(results => {
  if (!results.multiHandLandmarks || !nail) return;

  const finger = results.multiHandLandmarks[0][8]; // telunjuk

  nail.position.x = (finger.x - 0.5) * 2;
  nail.position.y = -(finger.y - 0.5) * 2;
});

/* =====================
   START CAMERA (USER TAP)
===================== */
const videoElement = document.getElementById("video");
const startBtn = document.getElementById("startBtn");

startBtn.onclick = () => {
  startBtn.style.display = "none";

  const cam = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
      renderer.render(scene, camera3D);
    },
    facingMode: "environment",
    width: 1280,
    height: 720
  });

  cam.start();
};
</script>
